<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ci-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#159447"/>
      <stop offset="100%" style="stop-color:#1DB85E"/>
    </linearGradient>
    <linearGradient id="ci-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F7A3A"/>
      <stop offset="100%" style="stop-color:#159447"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#ci-grad)" opacity="0.1"/>
  
  <!-- Graduation cap base -->
  <path d="M60 28 L95 45 L60 62 L25 45 Z" fill="url(#ci-grad)" stroke="url(#ci-grad-dark)" stroke-width="1.5"/>
  
  <!-- Cap top -->
  <path d="M30 48 L60 32 L90 48 L60 64 Z" fill="url(#ci-grad-dark)" opacity="0.9"/>
  
  <!-- Tassel -->
  <line x1="60" y1="62" x2="60" y2="82" stroke="#159447" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="60" cy="85" r="3.5" fill="#159447"/>
  
  <!-- Network nodes (inter connectivity) -->
  <circle cx="25" cy="45" r="4" fill="url(#ci-grad)" opacity="0.7"/>
  <circle cx="95" cy="45" r="4" fill="url(#ci-grad)" opacity="0.7"/>
  <circle cx="60" cy="28" r="4" fill="url(#ci-grad)" opacity="0.7"/>
  
  <!-- Connection lines -->
  <line x1="25" y1="45" x2="60" y2="28" stroke="#1DB85E" stroke-width="1" opacity="0.4" stroke-dasharray="3,3"/>
  <line x1="95" y1="45" x2="60" y2="28" stroke="#1DB85E" stroke-width="1" opacity="0.4" stroke-dasharray="3,3"/>
  <line x1="25" y1="45" x2="95" y2="45" stroke="#1DB85E" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  
  <!-- CI initials -->
  <text x="60" y="112" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#252525" letter-spacing="0.5">CAMPUS INTER</text>
</svg>
