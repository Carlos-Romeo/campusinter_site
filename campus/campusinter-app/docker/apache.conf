<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Désactiver PHP dans le dossier uploads (sécurité)
    <Directory /var/www/storage/uploads>
        php_admin_flag engine off
        Options -ExecCGI
        <FilesMatch "\.(?i:php|php3|php4|php5|phtml|pht|phps|cgi|pl|asp|aspx|jsp)$">
            Order allow,deny
            Deny from all
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
